<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">


<defs>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#E7CF78"/>

<stop offset="100%" stop-color="#C8A951"/>

</linearGradient>


</defs>



<!-- BACKGROUND -->

<rect width="1200" height="900" fill="#050505"/>





<!-- BARBER POLE -->

<g opacity="0.18">


<rect x="900" y="180" width="80" height="420" rx="40"
fill="none"
stroke="url(#gold)"
stroke-width="8"/>



<path d="M910 250 L970 310
M910 350 L970 410
M910 450 L970 510"

stroke="url(#gold)"
stroke-width="12"/>


</g>







<!-- SCISSORS -->


<g opacity="0.16"
stroke="url(#gold)"
stroke-width="8"
fill="none">


<circle cx="250" cy="300" r="45"/>

<circle cx="380" cy="300" r="45"/>


<path d="M280 330 L500 520"/>

<path d="M350 330 L500 520"/>


</g>








<!-- RAZOR -->


<g opacity="0.15"
stroke="url(#gold)"
fill="none"
stroke-width="8">


<path d="M600 200
L760 360
L690 430
L530 270
Z"/>


<line x1="560" y1="300" x2="720" y2="460"/>


</g>









<!-- COMB -->


<g opacity="0.13"
stroke="url(#gold)"
stroke-width="7"
fill="none">


<rect x="200" y="650"
width="300"
height="70"
rx="20"/>


<line x1="230" y1="650"
x2="230" y2="720"/>


<line x1="270" y1="650"
x2="270" y2="720"/>


<line x1="310" y1="650"
x2="310" y2="720"/>


<line x1="350" y1="650"
x2="350" y2="720"/>


<line x1="390" y1="650"
x2="390" y2="720"/>


</g>







<!-- DECORATIVE LINES -->


<g opacity="0.08"
stroke="url(#gold)"
stroke-width="3">


<circle cx="600" cy="450" r="300"/>

<circle cx="600" cy="450" r="350"/>


</g>





</svg>